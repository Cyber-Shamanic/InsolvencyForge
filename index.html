let dbPromise;function getDB(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('insolvencyforge_files',1);req.onupgradeneeded=()=>req.result.createObjectStore('files',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}async function transact(mode,action){const db=await getDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files',mode),req=action(tx.objectStore('files'));req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function renderFiles(){try{const files=await transact('readonly',s=>s.getAll());if(page!=='docs')return;$('#fileCount').textContent=files.length+' קבצים';$('#fileList').innerHTML=files.length?files.map(f=>`<div class="docrow"><span style="font-size:25px">${f.type.includes('pdf')?'📕':'📄'}</span><div class="grow"><strong>${escapeHTML(f.name)}</strong><small>${new Date(f.date).toLocaleDateString('he-IL')} · ${(f.size/1024).toFixed(0)} KB</small></div><button class="mini open-file" data-id="${f.id}">פתיחה</button><button class="mini save-file" data-id="${f.id}">הורדה</button><button class="mini danger delete-file" data-id="${f.id}">מחיקה</button></div>`).join(''):'<div class="empty">📁 טרם הועלו קבצים. לחץ על ״בחר קבצים להעלאה״.</div>';document.querySelectorAll('.open-file,.save-file').forEach(b=>b.onclick=async()=>{const f=await transact('readonly',s=>s.get(b.dataset.id));if(!f)return;const url=URL.createObjectURL(f.blob);if(b.classList.contains('open-file')){const w=window.open(url,'_blank','noopener');if(!w){alert('אפשר לפתוח את הקובץ באמצעות כפתור ההורדה')}setTimeout(()=>URL.revokeObjectURL(url),60000)}else download(f.blob,f.name)});document.querySelectorAll('.delete-file').forEach(b=>b.onclick=async()=>{if(!confirm('למחוק את הקובץ מהמכשיר?'))return;await transact('readwrite',s=>s.delete(b.dataset.id));renderFiles()})}catch{$('#fileList').innerHTML='<div class="notice">אחסון הקבצים אינו זמין בדפדפן זה. בדוק הגדרות גלישה
